<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reachr — Smart Payment Links & Delivery Protection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b1020;
  --ink: #f6f7ff;
  --mut: #a5b0d1;
  --card: rgba(20, 29, 56, 0.85);
  --line: rgba(166, 184, 255, 0.18);
  --violet: #8b5cf6;
  --pink: #ff4f87;
  --tang: #ff9f43;
  --teal: #21d4b4;
  --lemon: #f6d365;
  --sky: #43b9ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 80px; scroll-behavior: smooth; }
body {
  margin: 0;
  background: radial-gradient(ellipse at 8% 0%, rgba(139, 92, 246, 0.23), transparent 35%),
              radial-gradient(ellipse at 100% 24%, rgba(255, 79, 135, 0.15), transparent 32%),
              radial-gradient(ellipse at 55% 100%, rgba(33, 212, 180, 0.12), transparent 38%),
              var(--bg);
  color: var(--ink);
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Background Morphing Blobs - Vibrant, No Grid */
.blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; opacity: 0.65; }
.b { position: absolute; filter: blur(60px); opacity: 0.75; animation: morphBlob 14s ease-in-out infinite alternate; }
.b1 { width: 46vmax; height: 46vmax; background: #ff4f87; left: -12vmax; top: -10vmax; }
.b2 { width: 40vmax; height: 40vmax; background: #f6d365; right: -10vmax; top: 18vh; animation-delay: -4s; }
.b3 { width: 44vmax; height: 44vmax; background: #6d5dfc; left: 20vw; bottom: -22vmax; animation-delay: -8s; opacity: 0.55; }
.b4 { width: 26vmax; height: 26vmax; background: #21d4b4; right: 25vw; top: -8vmax; animation-delay: -2s; }
@keyframes morphBlob {
  0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; transform: translate(0, 0) rotate(0deg); }
  50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
  100% { border-radius: 50% 50% 40% 60% / 30% 70% 60% 40%; transform: translate(4vmax, 3vmax) rotate(40deg); }
}

/* Cursor glow spotlight */
.spot {
  position: fixed; width: 420px; height: 420px; border-radius: 50%; pointer-events: none; z-index: 0;
  background: radial-gradient(circle, rgba(255, 79, 135, 0.25), rgba(139, 92, 246, 0.1) 40%, transparent 70%);
  transform: translate(-50%, -50%); left: -999px; top: -999px;
}

/* App Container */
.app { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 18px 20px 80px; }

/* Sticky Top Navigation */
nav {
  position: sticky; top: 12px; z-index: 50; display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 26px; padding: 10px 16px; background: rgba(12, 17, 36, 0.85);
  backdrop-filter: blur(20px); border: 1px solid var(--line); border-radius: 99px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35); flex-wrap: wrap;
}
.logo {
  font-weight: 800; font-size: 24px; letter-spacing: -0.04em; cursor: pointer; display: flex;
  align-items: center; gap: 8px; background: none; border: 0; color: #fff; font-family: inherit;
}
.dot {
  width: 20px; height: 20px; border-radius: 6px;
  background: linear-gradient(135deg, var(--pink), var(--tang) 48%, var(--lemon));
  animation: morphBlob 6s ease-in-out infinite alternate; box-shadow: 0 0 16px rgba(255, 79, 135, 0.4);
}
.nl { display: flex; gap: 4px; }
.nl button {
  border: 0; background: none; color: var(--mut); font-family: inherit; font-size: 13px; font-weight: 600;
  padding: 6px 12px; border-radius: 99px; cursor: pointer; transition: all 0.2s;
}
.nl button:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
@media (max-width: 820px) { .nl { display: none; } }

.tabs {
  display: flex; gap: 4px; background: rgba(255, 255, 255, 0.06); padding: 4px;
  border-radius: 99px; border: 1px solid var(--line);
}
.tab {
  border: 0; background: none; color: var(--mut); font: 700 13px inherit; font-family: inherit;
  padding: 8px 16px; border-radius: 99px; cursor: pointer; transition: all 0.2s;
}
.tab:hover { color: #fff; }
.tab.on {
  color: #fff; background: linear-gradient(115deg, #7757ff, #c052ff 55%, #ff4f87);
  box-shadow: 0 4px 18px rgba(139, 92, 246, 0.35);
}

.nav-actions { display: flex; align-items: center; gap: 8px; }
.dl-btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 99px;
  background: rgba(33, 212, 180, 0.15); border: 1px solid rgba(33, 212, 180, 0.4);
  color: #5ff2d7; font-size: 12px; font-weight: 700; text-decoration: none; cursor: pointer; transition: all 0.2s;
}
.dl-btn:hover { background: rgba(33, 212, 180, 0.25); transform: translateY(-1px); }

/* Typography & Hero */
h1 {
  font-size: clamp(38px, 7vw, 76px); line-height: 0.98; letter-spacing: -0.05em;
  margin: 24px 0 16px; font-weight: 800; max-width: 14ch;
}
h1 span {
  background: linear-gradient(100deg, #ff4f87 0%, #ff9f43 35%, #f6d365 60%, #21d4b4 85%, #43b9ff 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.lead { font-size: 18px; color: var(--mut); max-width: 52ch; line-height: 1.5; margin-bottom: 24px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* Buttons */
.btn {
  border: 0; font: 700 15px inherit; font-family: inherit; color: #fff; padding: 13px 24px;
  border-radius: 99px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s, border-radius 0.3s;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2); display: inline-flex; align-items: center; gap: 8px;
}
.btn:hover { transform: translateY(-2px) scale(1.02); border-radius: 20px 45px 20px 45px; box-shadow: 0 14px 28px rgba(0, 0, 0, 0.3); }
.btn:active { transform: scale(0.96); }
.btn:disabled { opacity: 0.45; cursor: default; transform: none; }
.bv { background: linear-gradient(120deg, var(--violet), var(--sky)); }
.bp { background: linear-gradient(120deg, var(--pink), var(--tang)); }
.bt { background: linear-gradient(120deg, var(--teal), var(--sky)); color: #12082b; }
.bl { background: linear-gradient(120deg, var(--lemon), var(--tang)); color: #1d1340; }
.ghost { background: rgba(255, 255, 255, 0.04); border: 1.5px solid var(--line); color: var(--ink); }
.ghost:hover { background: rgba(255, 255, 255, 0.08); }

/* The Moving Straps - Straight, Parallel, Slow Gentle Glide */
.straps-wrap { margin: 40px 0 30px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
@keyframes marquee-scroll {
  0% { transform: translate3d(0, 0, 0); }
  100% { transform: translate3d(-50%, 0, 0); }
}
@keyframes marquee-scroll-reverse {
  0% { transform: translate3d(-50%, 0, 0); }
  100% { transform: translate3d(0, 0, 0); }
}
.strap-1 {
  overflow: hidden; background: linear-gradient(90deg, #7657ff, #c052ff, #ff4f87, #ff9f43);
  color: white; padding: 10px 0; border-radius: 12px;
}
.strap-1-track {
  display: flex !important; width: max-content !important; min-width: 200% !important;
  animation: marquee-scroll 70s linear infinite !important; font-weight: 800; font-size: 14px;
  letter-spacing: 0.02em; text-transform: uppercase; gap: 32px; will-change: transform;
}
.strap-2 {
  overflow: hidden; background: #11182e; border: 1px solid rgba(255, 255, 255, 0.1);
  color: #a5b0d1; padding: 9px 0; border-radius: 12px;
}
.strap-2-track {
  display: flex !important; width: max-content !important; min-width: 200% !important;
  animation: marquee-scroll-reverse 85s linear infinite !important; font-weight: 700; font-size: 13px;
  letter-spacing: 0.02em; text-transform: uppercase; gap: 32px; will-change: transform;
}

/* Cards & Grid Containers */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 24px;
  padding: 24px; backdrop-filter: blur(20px); box-shadow: 0 16px 45px rgba(0, 0, 0, 0.25);
  margin-bottom: 20px;
}
.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 36px; }
.fl {
  padding: 22px; color: #fff; font-weight: 600; line-height: 1.35; border-radius: 24px;
  border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 14px 34px rgba(0, 0, 0, 0.18);
  transition: transform 0.3s, border-radius 0.5s;
}
.fl:hover { transform: translateY(-4px) scale(1.02); border-radius: 40px 18px 40px 18px; }
.fl b { display: block; font-size: 20px; margin-bottom: 6px; }

.g3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 24px; }
.ft {
  padding: 24px; color: #fff; min-height: 180px; border-radius: 24px;
  border: 1px solid rgba(255, 255, 255, 0.12); transition: transform 0.3s, border-radius 0.5s;
  box-shadow: 0 14px 36px rgba(0, 0, 0, 0.15);
}
.ft:hover { transform: translateY(-4px) scale(1.02); border-radius: 45px 20px 45px 20px; }
.ft i { font-style: normal; font-size: 32px; display: inline-block; margin-bottom: 8px; }
.ft b { font-size: 20px; display: block; margin: 4px 0 6px; letter-spacing: -0.02em; }
.ft p { margin: 0; color: rgba(255, 255, 255, 0.85); font-size: 14px; line-height: 1.45; }

/* 4-Stage Dispute Shield Badge */
.esc {
  display: inline-flex; align-items: center; gap: 12px; padding: 10px 20px 10px 14px;
  background: var(--card); border: 1.5px solid var(--violet); border-radius: 99px 24px 24px 99px;
  margin-top: 14px; backdrop-filter: blur(14px);
}
.esc svg { width: 36px; height: 42px; flex: none; }
.esc b { display: block; font-size: 14px; color: #fff; margin: 0; }
.esc small { display: block; color: var(--mut); font-size: 11px; }

/* Pricing Cards & 44% Annual Savings */
.pricing-toggle {
  display: flex; align-items: center; justify-content: center; gap: 12px; margin: 24px 0;
}
.toggle-btn {
  padding: 8px 18px; border-radius: 99px; font-weight: 700; font-size: 13px; cursor: pointer;
  border: 1px solid var(--line); background: rgba(255, 255, 255, 0.05); color: var(--mut); transition: all 0.2s;
}
.toggle-btn.active {
  background: linear-gradient(120deg, var(--violet), var(--pink)); color: #fff; border-color: transparent;
  box-shadow: 0 4px 18px rgba(139, 92, 246, 0.3);
}
.pr {
  padding: 26px; border-radius: 28px; background: var(--card); border: 1px solid var(--line);
  backdrop-filter: blur(14px); transition: transform 0.2s;
}
.pr:hover { transform: translateY(-4px); }
.pr.hot {
  background: linear-gradient(150deg, rgba(139, 92, 246, 0.85), rgba(255, 79, 135, 0.85));
  border: 1.5px solid rgba(255, 255, 255, 0.3); box-shadow: 0 18px 45px rgba(139, 92, 246, 0.35);
}
.pr h3 { margin: 0; font-size: 20px; color: #fff; }
.pr .pz { font-size: 44px; font-weight: 800; letter-spacing: -0.05em; margin: 8px 0; color: #fff; }
.pr ul { padding-left: 18px; line-height: 1.7; color: var(--mut); font-size: 13px; margin: 16px 0; }
.pr.hot ul { color: #fff; }

/* Interactive Form & Inputs */
input, select, textarea {
  width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line);
  border-radius: 12px; padding: 11px 14px; color: var(--ink); font-family: inherit; font-size: 14px;
  margin: 6px 0 14px; outline: none; transition: border-color 0.2s;
}
input:focus, select, textarea:focus { border-color: var(--violet); }
label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--mut); }
.inline-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 540px) { .inline-fields { grid-template-columns: 1fr; } }

/* Order Chat & Timeline */
.chat { max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin: 12px 0; padding: 4px; }
.m { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.35; }
.m small { display: block; opacity: 0.7; font-size: 10px; margin-top: 3px; font-family: monospace; }
.m.customer { background: #168be5; color: #fff; align-self: flex-start; border-bottom-left-radius: 4px; }
.m.seller { background: linear-gradient(135deg, #ff4f87, #c052ff); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
.m.system { background: var(--lemon); color: #1d1340; align-self: center; font-size: 12px; text-align: center; border-radius: 10px; }

/* 4 Dispute Steps Indicator */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 14px 0; }
.sp { padding: 9px 4px; text-align: center; font-size: 11px; font-weight: 700; border-radius: 10px; background: rgba(255, 255, 255, 0.05); color: var(--mut); border: 1px solid var(--line); }
.sp.done { background: var(--teal); color: #12082b; border-color: transparent; }
.sp.cur { background: linear-gradient(120deg, var(--pink), var(--tang)); color: #fff; border-color: transparent; transform: scale(1.04); }
.tl { margin: 12px 0; padding-left: 14px; border-left: 3px solid var(--violet); }
.tl p { margin: 0 0 8px; font-size: 13px; }
.tl b { color: #c8b8ff; }

/* Toast Notification */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: linear-gradient(120deg, var(--violet), var(--pink)); color: #fff;
  padding: 11px 22px; border-radius: 99px; font-weight: 700; font-size: 13px; z-index: 99;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); animation: toastPop 0.3s cubic-bezier(0.3, 1.6, 0.5, 1);
}
@keyframes toastPop { from { transform: translate(-50%, 20px) scale(0.8); opacity: 0; } }

/* Trust Center Panels */
.tc-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; margin: 20px 0; }
.tc-panel {
  grid-column: span 6; background: var(--card); border: 1px solid var(--line);
  border-radius: 22px; padding: 20px; backdrop-filter: blur(14px);
}
.tc-panel.wide { grid-column: span 12; }
@media (max-width: 820px) { .tc-panel { grid-column: span 12; } }
.tc-label { font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--violet); }
.tc-map { height: 200px; position: relative; overflow: hidden; border-radius: 16px; background: #122b3a; margin: 12px 0; }
.tc-track { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 16px 0 10px; }
.tc-step { text-align: center; color: var(--mut); font-size: 10px; font-weight: 700; }
.tc-step .tc-dot {
  width: 24px; height: 24px; border-radius: 50%; background: rgba(255, 255, 255, 0.05);
  border: 2px solid var(--line); display: grid; place-items: center; margin: 0 auto 6px;
}
.tc-step.done .tc-dot { background: var(--teal); border-color: var(--teal); color: #12082b; font-weight: 900; }
.tc-step.current .tc-dot { background: var(--violet); border-color: var(--violet); color: #fff; box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.3); }

/* Details Accordion */
details { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 18px; margin-top: 10px; }
summary { font-weight: 700; font-size: 16px; cursor: pointer; color: #fff; }
details p { color: var(--mut); line-height: 1.5; margin: 8px 0 0; font-size: 14px; }
footer { margin-top: 60px; padding-top: 24px; border-top: 1px solid var(--line); color: var(--mut); font-size: 13px; }
</style>
</head>
<body>
<div class="blobs"><i class="b b1"></i><i class="b b2"></i><i class="b b3"></i><i class="b b4"></i></div>
<div class="app" id="app"></div>

<script>
const esc = t => String(t || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const inr = n => '₹' + Number(n).toLocaleString('en-IN');
const clock = () => new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
const sm = (s, n, t) => ({ id: Math.random().toString(36).slice(2), sender: s, senderName: n, text: t, timestamp: clock() });

const BIZ = 'Meera’s Handloom', VPA = 'meera@upi';

const PM = {
  upi: { name: 'UPI', icon: '⚡', pre: 'UPI', opts: ['GPay', 'PhonePe', 'Paytm', 'BHIM'], hint: l => 'Direct UPI to ' + l.businessVpa, cta: l => 'Pay ' + inr(l.amount) },
  card: { name: 'Cards', icon: '💳', pre: 'CRD', opts: ['Visa', 'Mastercard', 'RuPay', 'Amex'], hint: () => 'Simulated card checkout. No card numbers stored.', cta: l => 'Pay ' + inr(l.amount) },
  bank: { name: 'Netbanking', icon: '🏦', pre: 'NBK', opts: ['HDFC', 'SBI', 'ICICI', 'Axis'], hint: () => 'Simulated direct bank authorization.', cta: l => 'Pay ' + inr(l.amount) },
  wallet: { name: 'Wallets', icon: '👛', pre: 'WLT', opts: ['Paytm Wallet', 'Amazon Pay', 'Mobikwik'], hint: () => 'Pay instantly from balance.', cta: l => 'Pay ' + inr(l.amount) },
  emi: { name: 'EMI', icon: '📆', pre: 'EMI', opts: ['3 months', '6 months', '9 months'], hint: l => { const n = parseInt(S.app) || 6; return '~' + inr(Math.ceil(l.amount / n)) + '/month for ' + n + ' months'; }, cta: () => 'Confirm EMI' },
  cod: { name: 'COD', icon: '💵', pre: 'COD', opts: ['Cash on delivery'], hint: () => 'Pay cash to the delivery executive when the parcel arrives.', cta: () => 'Confirm Cash on Delivery' }
};

const S = {
  view: 'landing', sel: null, app: 'GPay', method: 'upi', toast: '', q: '', f: 'all',
  billingAnnual: true, trackStep: 3, readNotices: false, rewardClaimed: false, aiResult: '', proofName: '', proofData: '',
  tcIssue: 'Item not as described', tcDetails: '',
  links: [
    {
      id: 'l1', linkCode: 'RCH-4F2A', customerName: 'Ananya Rao', amount: 2400, note: 'Kalamkari dupatta set',
      businessName: BIZ, businessVpa: VPA, status: 'pending',
      messages: [sm('seller', BIZ, 'Hi Ananya! Here is your Reachr smart payment link with delivery protection.')]
    },
    {
      id: 'l2', linkCode: 'RCH-9K1D', customerName: 'Rohit Sharma', amount: 1150, note: 'Cotton kurta, size M',
      businessName: BIZ, businessVpa: VPA, status: 'paid', upiRef: 'UPI4096211873',
      messages: [sm('system', 'Reachr', 'Payment confirmed via GPay. Order moved to processing.')]
    },
    {
      id: 'l3', linkCode: 'RCH-2Z7C', customerName: 'Priya Nair', amount: 3900, note: 'Handwoven Chanderi saree',
      businessName: BIZ, businessVpa: VPA, status: 'disputed', upiRef: 'UPI4096200412',
      dispute: {
        id: 'd1', raisedAt: '10:30 AM', reason: 'Color variation from photo', currentStage: 2,
        proposedSolution: 'Free matching blouse piece + 25% store credit coupon',
        timeline: [
          { stage: 1, title: 'Dispute Raised', description: 'Buyer reported color variation.', timestamp: '10:30 AM', actor: 'customer' },
          { stage: 2, title: 'Seller Proposed Solution', description: 'Offered free matching blouse piece + 25% coupon.', timestamp: '10:45 AM', actor: 'seller' }
        ]
      },
      messages: [
        sm('customer', 'Priya Nair', 'Hi Meera, the saree arrived but the border color is darker than shown.'),
        sm('seller', BIZ, 'I understand Priya! I just submitted a replacement proposal in the dispute tab.')
      ]
    }
  ]
};

// Sound Synthesizer via Web Audio API
const ctx = window.AudioContext ? new (window.AudioContext || window.webkitAudioContext)() : null;
function playChime() {
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator(); const g = ctx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
    g.gain.setValueAtTime(0.12, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.36);
  } catch(e) {}
}

const cur = () => S.links.find(l => l.id === S.sel);
const toast = t => { S.toast = t; draw(); playChime(); setTimeout(() => { S.toast = ''; draw(); }, 2400); };
const ev = (d, stage, title, description, actor) => { d.currentStage = stage; d.timeline.push({ stage, title, description, timestamp: clock(), actor }); };

function shield() {
  return `<div class="esc">
    <svg viewBox="0 0 40 46" aria-hidden="true">
      <path d="M20 2 L37 8 V22 C37 33 29 41 20 44 C11 41 3 33 3 22 V8 Z" fill="var(--violet)"/>
      <path d="M12 19 L18 25 L28 13" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="11.5" cy="33" r="2.3" fill="var(--pink)"/>
      <circle cx="17" cy="35" r="2.3" fill="var(--tang)"/>
      <circle cx="23" cy="35" r="2.3" fill="var(--lemon)"/>
      <circle cx="28.5" cy="33" r="2.3" fill="var(--teal)"/>
    </svg>
    <div>
      <b>4-Stage FairResolve™ Protocol</b>
      <small>Raised → Seller proposal → Reachr review → Resolved</small>
    </div>
  </div>`;
}

function landing() {
  const annual = S.billingAnnual;
  return `
  <section style="text-align:center; padding: 20px 0 10px;">
    <h1>Get paid. <span>Stay fair.</span></h1>
    <p class="lead" style="margin: 0 auto 24px;">Send smart payment links on WhatsApp or Instagram, chat in one thread, and resolve delivery disputes in 4 clear steps.</p>

    </section>

    <!-- ProofVault Center -->
    <section class="tc-panel">
      <div class="tc-label">02 / ProofVault™ Center</div>
      <h3 style="margin:4px 0 8px;">Delivery & Dispatch Proof</h3>
      <p style="color:var(--mut); font-size:13px; line-height:1.4;">Attach parcel packing or delivery receipt images. Image renders instantly in local memory.</p>
      <input type="file" id="tcProofFile" accept="image/*">
      <div id="tcProofPreview" style="margin-top:8px;">
        ${S.proofData ? `<img src="${S.proofData}" style="max-width:100%; max-height:140px; border-radius:12px;" alt="Delivery Proof">` : '<small style="color:var(--mut);">No proof uploaded yet</small>'}
      </div>
    </section>

    <!-- AI Evidence Checklist -->
    <section class="tc-panel">
      <div class="tc-label">03 / FairResolve Evidence Builder</div>
      <h3 style="margin:4px 0 8px;">AI Evidence Checklist</h3>
      <select id="tcIssue">
        <option>Item not as described</option>
        <option>Parcel missing in transit</option>
        <option>Broken / defective upon opening</option>
      </select>
      <textarea id="tcDetails" rows="2" placeholder="Describe the dispute situation...">${esc(S.tcDetails)}</textarea>
      <button class="btn bv" data-act="aiassist" style="width:100%; justify-content:center; font-size:13px;">Generate Evidence Checklist</button>
      <div style="margin-top:10px; background:rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:12px; padding:12px; font-size:12px; line-height:1.5; white-space:pre-wrap;">
        ${S.aiResult ? esc(S.aiResult) : 'Click generate to view required evidence checklist.'}
      </div>
    </section>
  </div>
  `;
}

function draw() {
  const v = S.view;
  document.getElementById('app').innerHTML = `
    <nav>
      <button class="logo" data-act="role" data-v="landing">
        <i class="dot"></i>Reachr
      </button>

      ${v === 'landing' ? `
        <div class="nl">
          <button data-act="jump" data-v="features">Features</button>
          <button data-act="jump" data-v="pricing">Pricing</button>
          <button data-act="jump" data-v="faq">FAQ</button>
        </div>
      ` : ''}

      <div class="tabs">
        <button class="tab ${v === 'landing' ? 'on' : ''}" data-act="role" data-v="landing">Home</button>
        <button class="tab ${v === 'seller' ? 'on' : ''}" data-act="role" data-v="seller">Seller</button>
        <button class="tab ${v === 'customer' ? 'on' : ''}" data-act="role" data-v="customer">Buyer</button>
        <button class="tab ${v === 'center' ? 'on' : ''}" data-act="role" data-v="center">Trust Hub</button>
      </div>

      <div class="nav-actions">
        <button class="dl-btn" data-act="download-file" title="Download this standalone HTML file">
          <span>📥</span> Download HTML
        </button>
      </div>
    </nav>
    ${v === 'landing' ? landing() : v === 'seller' ? seller() : v === 'center' ? trustCenter() : customer()}
    ${S.toast ? `<div class="toast">${esc(S.toast)}</div>` : ''}
    <footer>
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
        <div><b>Reachr</b> — Smart Payment Links & 4-Stage Delivery Protection.</div>
        <div>Offline Standalone Edition · MIT License 2026</div>
      </div>
    </footer>
  `;

  const c = document.getElementById('chat');
  if (c) c.scrollTop = c.scrollHeight;
}

// Global click event dispatcher
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  const l = cur();
  const role = S.view === 'seller' ? 'seller' : 'customer';

  if (a === 'download-file') {
    // Generates a native download of the current HTML document
    const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const downloadAnchor = document.createElement('a');
    downloadAnchor.href = url;
    downloadAnchor.download = 'Reachr_Standalone.html';
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
    URL.revokeObjectURL(url);
    toast('Downloaded Reachr_Standalone.html to your device!');
    return;
  }

  if (a === 'role') { S.view = b.dataset.v; S.sel = null; draw(); return; }
  if (a === 'open') { S.sel = b.dataset.id; draw(); return; }
  if (a === 'back') { S.sel = null; draw(); return; }
  if (a === 'method') { S.method = b.dataset.v; S.app = PM[S.method].opts[0]; draw(); return; }
  if (a === 'app') { S.app = b.dataset.v; draw(); return; }
  if (a === 'jump') { document.getElementById(b.dataset.v)?.scrollIntoView({ behavior: 'smooth' }); return; }
  if (a === 'scroll-create') { document.getElementById('create-card')?.scrollIntoView({ behavior: 'smooth' }); return; }
  if (a === 'toggle-bill') { S.billingAnnual = b.dataset.v === 'annual'; draw(); return; }
  if (a === 'tracknext') { S.trackStep = Math.min(5, S.trackStep + 1); draw(); return; }
  if (a === 'trackprev') { S.trackStep = Math.max(0, S.trackStep - 1); draw(); return; }

  if (a === 'copy' && l) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(location.href).then(() => toast('Payment link copied!')).catch(() => toast('Link copied!'));
    } else {
      toast('Payment link copied!');
    }
    return;
  }

  if (a === 'cashin' && l) {
    l.status = 'paid';
    l.messages.push(sm('system', 'Reachr', 'Seller recorded full cash payment upon parcel delivery.'));
    toast('Recorded cash payment of ' + inr(l.amount));
    draw();
    return;
  }

  if (a === 'pay' && l) {
    l.status = 'paid';
    l.messages.push(sm('system', 'Reachr', 'Payment of ' + inr(l.amount) + ' confirmed via ' + S.app + '.'));
    toast('Payment confirmed via ' + S.app);
    draw();
    return;
  }

  if (a === 'send' && l) {
    const input = document.getElementById('msg');
    if (!input || !input.value.trim()) return;
    const txt = input.value.trim();
    l.messages.push(sm(role, role === 'seller' ? l.businessName : l.customerName, txt));
    input.value = '';
    draw();
    return;
  }

  if (a === 'dispute' && l) {
    const rsn = document.getElementById('rsn')?.value || 'Item not as described';
    l.status = 'disputed';
    l.dispute = {
      id: 'd' + Date.now(),
      raisedAt: clock(),
      reason: rsn,
      currentStage: 1,
      timeline: [
        { stage: 1, title: 'Dispute Raised', description: 'Buyer reported: ' + rsn, timestamp: clock(), actor: 'customer' }
      ]
    };
    l.messages.push(sm('system', 'Reachr', 'Dispute initiated: ' + rsn + '. Seller notified to submit proposal.'));
    toast('Dispute initiated');
    draw();
    return;
  }

  if (a === 'propose' && l && l.dispute) {
    const sol = document.getElementById('sol')?.value.trim();
    if (!sol) return toast('Please enter a proposal');
    l.dispute.proposedSolution = sol;
    ev(l.dispute, 2, 'Seller Proposal', 'Seller offered: ' + sol, 'seller');
    l.messages.push(sm('seller', l.businessName, 'Proposed resolution: ' + sol));
    toast('Proposal submitted to buyer');
    draw();
    return;
  }

  if (a === 'accept' && l && l.dispute) {
    ev(l.dispute, 4, 'Resolved by Agreement', 'Buyer accepted seller proposal.', 'customer');
    l.status = 'resolved';
    l.messages.push(sm('system', 'Reachr', 'Dispute resolved amicably by mutual agreement.'));
    toast('Dispute successfully resolved!');
    draw();
    return;
  }

  if (a === 'reject' && l && l.dispute) {
    ev(l.dispute, 3, 'Reachr Review Requested', 'Buyer requested Reachr neutral mediator review.', 'customer');
    l.messages.push(sm('system', 'Reachr', 'Neutral mediation assigned. Proof review in progress.'));
    toast('Mediator review requested');
    draw();
    return;
  }

  if (a === 'reviewcomplete' && l && l.dispute) {
    ev(l.dispute, 4, 'Resolved via Mediation', 'Review completed with balanced resolution.', 'reviewer');
    l.status = 'resolved';
    l.messages.push(sm('system', 'Reachr', 'Dispute concluded by Reachr Trust & Safety.'));
    toast('Mediation completed');
    draw();
    return;
  }

  if (a === 'aiassist') {
    const issue = document.getElementById('tcIssue')?.value || 'Issue';
    const detail = document.getElementById('tcDetails')?.value.trim() || 'No specifics';
    S.aiResult = `FAIRRESOLVE EVIDENCE CHECKLIST for ${issue}:\n\n1. Timestamped photos of unboxing or package state.\n2. Original product description & promised specifications.\n3. Courier tracking number and geotagged delivery log.\n4. Prior chat communications regarding the defect or delay.\n\nSummary note: ${detail}`;
    toast('Checklist generated!');
    draw();
    return;
  }
});

// Image upload preview for ProofVault
document.addEventListener('change', e => {
  if (e.target.id === 'tcProofFile') {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      S.proofData = reader.result;
      toast('Photo attached to ProofVault');
      draw();
    };
    reader.readAsDataURL(file);
  }
});

// Form submit for link creation
document.addEventListener('submit', e => {
  if (e.target.id === 'nf') {
    e.preventDefault();
    const name = document.getElementById('cn').value.trim();
    const amt = +document.getElementById('am').value;
    const note = document.getElementById('nt').value.trim();
    const link = {
      id: 'l' + Date.now(),
      linkCode: 'RCH-' + Math.random().toString(36).slice(2, 6).toUpperCase(),
      customerName: name,
      amount: amt,
      note: note,
      businessName: BIZ,
      businessVpa: VPA,
      status: 'pending',
      messages: [sm('seller', BIZ, 'Hi ' + name + '! Here is your Reachr payment link: ' + note)]
    };
    S.links.unshift(link);
    toast('Created SmartPay link ' + link.linkCode);
    S.sel = link.id;
    draw();
  }
});

// Cursor glow
if (window.matchMedia && matchMedia('(pointer:fine)').matches) {
  const sp = document.createElement('div');
  sp.className = 'spot';
  document.body.appendChild(sp);
  window.addEventListener('pointermove', e => {
    sp.style.left = e.clientX + 'px';
    sp.style.top = e.clientY + 'px';
  });
}

draw();
</script>
</body>
</html>
