<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reachr — Smart Payment Links & Delivery Protection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>

/* ─── TOKENS ─────────────────────────────────────────────── */
:root {
  --bg:       #F9F5ED;
  --bg2:      #F2EDE2;
  --bg3:      #EDE7D9;
  --ink:      #191410;
  --ink2:     #3D3730;
  --mut:      #7A7268;
  --line:     #E0D9CE;
  --yolk:     #E8A818;
  --yolk-d:   #C48910;
  --yolk-s:   #FDF5DC;
  --terra:    #BF4D28;
  --olive:    #2A4535;
  --olive-s:  #EDF2EE;
  --card:     #FFFFFF;
  color-scheme: light;
}

/* ─── RESET & BASE ───────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: 80px;
  font-size: 16px;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100vh;
}

/* ─── SCROLL REVEAL ──────────────────────────────────────── */
.r {
  opacity: 0;
  transform: translateY(36px);
  transition:
    opacity  0.8s cubic-bezier(0.16, 1, 0.3, 1),
    transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}
.r.on { opacity: 1; transform: translateY(0); }

.r-left {
  opacity: 0;
  transform: translateX(-24px);
  transition:
    opacity  0.75s cubic-bezier(0.16, 1, 0.3, 1),
    transform 0.75s cubic-bezier(0.16, 1, 0.3, 1);
}
.r-left.on { opacity: 1; transform: translateX(0); }

.r-scale {
  opacity: 0;
  transform: scale(0.94);
  transition:
    opacity  0.7s cubic-bezier(0.16, 1, 0.3, 1),
    transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
}
.r-scale.on { opacity: 1; transform: scale(1); }

/* delay helpers */
.d1 { transition-delay: 0.08s; }
.d2 { transition-delay: 0.16s; }
.d3 { transition-delay: 0.24s; }
.d4 { transition-delay: 0.32s; }
.d5 { transition-delay: 0.40s; }
.d6 { transition-delay: 0.48s; }

/* ─── NAVIGATION ─────────────────────────────────────────── */
#nav-wrap {
  position: sticky;
  top: 12px;
  z-index: 90;
  padding: 0 20px;
  pointer-events: none;
}

nav {
  pointer-events: all;
  max-width: 900px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(249, 245, 237, 0.88);
  backdrop-filter: blur(16px) saturate(160%);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  border: 1px solid var(--line);
  border-radius: 999px;
  box-shadow: 0 2px 20px rgba(25, 20, 16, 0.07);
}

.brand {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: 18px;
  letter-spacing: -0.04em;
  color: var(--ink);
  background: none;
  border: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0;
}
.brand-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--yolk);
}

.tabs {
  display: flex;
  gap: 2px;
  background: var(--bg2);
  padding: 3px;
  border-radius: 999px;
  border: 1px solid var(--line);
}
.tab {
  border: 0;
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  padding: 6px 15px;
  border-radius: 999px;
  cursor: pointer;
  background: none;
  color: var(--mut);
  transition: all 0.2s ease;
}
.tab:hover { color: var(--ink); }
.tab.on {
  background: var(--card);
  color: var(--ink);
  box-shadow: 0 1px 6px rgba(25,20,16,0.08);
}

.nav-save {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  color: var(--mut);
  background: none;
  border: 1px solid var(--line);
  padding: 6px 13px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.nav-save:hover { background: var(--bg2); color: var(--ink); }

/* ─── TYPOGRAPHY ─────────────────────────────────────────── */
.display {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: clamp(50px, 9.5vw, 112px);
  line-height: 0.95;
  letter-spacing: -0.045em;
  color: var(--ink);
}
.display em {
  font-family: 'Newsreader', Georgia, serif;
  font-style: italic;
  font-weight: 300;
  color: var(--terra);
}

.heading {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: clamp(26px, 4vw, 44px);
  letter-spacing: -0.035em;
  line-height: 1.08;
  color: var(--ink);
}

.subhead {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: clamp(18px, 2.5vw, 24px);
  letter-spacing: -0.025em;
  color: var(--ink);
}

.lead {
  font-size: 17px;
  line-height: 1.6;
  color: var(--mut);
  max-width: 52ch;
}
.lead strong { color: var(--ink2); font-weight: 600; }

/* ─── PILL BADGE ─────────────────────────────────────────── */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 13px;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--ink2);
}
.pill-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--olive);
}
.pill-yolk { background: var(--yolk-s); border-color: #F0D280; color: #7A5500; }
.pill-terra { background: #FDF0EB; border-color: #EAC0B0; color: var(--terra); }

/* ─── BUTTONS ────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: inherit;
  font-weight: 600;
  font-size: 14px;
  border: 0;
  cursor: pointer;
  border-radius: 999px;
  padding: 12px 24px;
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  text-decoration: none;
  white-space: nowrap;
}
.btn:active { transform: scale(0.97); }

.btn-ink {
  background: var(--ink);
  color: #fff;
}
.btn-ink:hover { background: #2E2920; }

.btn-yolk {
  background: var(--yolk);
  color: var(--ink);
  font-weight: 700;
}
.btn-yolk:hover { background: var(--yolk-d); }

.btn-ghost {
  background: transparent;
  color: var(--mut);
}
.btn-ghost:hover { color: var(--ink); background: var(--bg2); }

.btn-outline {
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--ink2);
}
.btn-outline:hover { background: var(--bg2); border-color: #CDC6BA; color: var(--ink); }

.btn-sm {
  font-size: 12.5px;
  padding: 8px 16px;
}

/* ─── LAYOUT HELPERS ─────────────────────────────────────── */
.wrap {
  max-width: 1000px;
  margin: 0 auto;
  padding: 0 24px;
}
.wrap-narrow {
  max-width: 700px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ─── HERO SECTION ───────────────────────────────────────── */
.hero {
  padding: 72px 24px 60px;
  text-align: center;
  position: relative;
}
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 80%, rgba(232, 168, 24, 0.07) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 80% 20%, rgba(191, 77, 40, 0.05) 0%, transparent 70%);
  pointer-events: none;
}
.hero-inner { position: relative; max-width: 820px; margin: 0 auto; }
.hero-pill { margin-bottom: 24px; }
.hero h1 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: clamp(50px, 9.5vw, 112px);
  line-height: 0.95;
  letter-spacing: -0.045em;
  color: var(--ink);
  margin-bottom: 24px;
}
.hero h1 em {
  font-family: 'Newsreader', Georgia, serif;
  font-style: italic;
  font-weight: 300;
  color: var(--terra);
}
.hero-lead {
  font-size: clamp(15px, 2vw, 18px);
  line-height: 1.6;
  color: var(--mut);
  max-width: 50ch;
  margin: 0 auto 32px;
}
.hero-cta {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

/* ─── MARQUEE ────────────────────────────────────────────── */
.marquee-outer {
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--bg2);
  overflow: hidden;
  padding: 11px 0;
  margin: 0;
}
.marquee-track {
  display: flex;
  width: max-content;
  animation: scroll-left 60s linear infinite;
  gap: 0;
}
.marquee-track span {
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.03em;
  color: var(--ink2);
  padding: 0 20px;
  border-right: 1px solid var(--line);
  white-space: nowrap;
}
.marquee-track span.sep {
  color: var(--line);
  padding: 0 8px;
  border: none;
}
@keyframes scroll-left {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* ─── EDITORIAL FEATURES ─────────────────────────────────── */
.features-section {
  padding: 80px 0;
}
.features-header {
  max-width: 1000px;
  margin: 0 auto 60px;
  padding: 0 24px;
}

.feat-item {
  border-top: 1px solid var(--line);
  padding: 48px 24px;
  max-width: 1000px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 100px 1fr;
  gap: 32px;
  align-items: start;
}
.feat-item:last-child { border-bottom: 1px solid var(--line); }

.feat-num {
  font-family: 'Newsreader', Georgia, serif;
  font-style: italic;
  font-weight: 300;
  font-size: clamp(48px, 6vw, 72px);
  line-height: 1;
  color: var(--terra);
  opacity: 0.65;
  letter-spacing: -0.02em;
}

.feat-body h3 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: clamp(20px, 2.8vw, 28px);
  letter-spacing: -0.025em;
  color: var(--ink);
  margin-bottom: 10px;
}
.feat-body p {
  font-size: 15.5px;
  line-height: 1.65;
  color: var(--mut);
  max-width: 55ch;
}

@media (max-width: 600px) {
  .feat-item { grid-template-columns: 60px 1fr; gap: 20px; }
  .feat-num { font-size: 40px; }
}

/* ─── PRICING ────────────────────────────────────────────── */
.pricing-section {
  padding: 80px 24px;
  background: var(--bg2);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.pricing-toggle {
  display: flex;
  gap: 3px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px;
  width: fit-content;
  margin: 20px auto 48px;
}
.tog-btn {
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  padding: 7px 18px;
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  background: none;
  color: var(--mut);
  transition: all 0.18s ease;
}
.tog-btn.on {
  background: var(--card);
  color: var(--ink);
  box-shadow: 0 1px 6px rgba(25,20,16,0.08);
}

.pricing-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
  max-width: 920px;
  margin: 0 auto;
}
.price-card {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 20px;
  padding: 28px;
  display: flex;
  flex-direction: column;
}
.price-card.feat {
  border-color: var(--yolk);
  background: #FFFEF9;
  position: relative;
}
.price-card.feat::before {
  content: 'POPULAR';
  position: absolute;
  top: -1px; right: 24px;
  background: var(--yolk);
  color: var(--ink);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.08em;
  padding: 4px 10px;
  border-radius: 0 0 8px 8px;
}
.price-tier {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 16px;
  color: var(--ink);
}
.price-sub {
  font-size: 12.5px;
  color: var(--mut);
  margin-top: 2px;
}
.price-val {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 48px;
  font-weight: 800;
  letter-spacing: -0.05em;
  color: var(--ink);
  line-height: 1;
  margin: 16px 0 4px;
}
.price-period {
  font-size: 12px;
  color: var(--mut);
  margin-bottom: 20px;
}
.price-feats {
  list-style: none;
  padding: 0;
  margin: 0 0 24px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.price-feats li {
  font-size: 13.5px;
  color: var(--ink2);
  padding-left: 20px;
  position: relative;
  line-height: 1.4;
}
.price-feats li::before {
  content: '✓';
  position: absolute;
  left: 0;
  color: var(--olive);
  font-weight: 800;
}

/* ─── CARDS (app views) ──────────────────────────────────── */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 24px;
  box-shadow: 0 2px 12px rgba(25,20,16,0.04);
}

/* ─── FORM ELEMENTS ──────────────────────────────────────── */
label {
  display: block;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink2);
  margin-bottom: 5px;
}
input, select, textarea {
  display: block;
  width: 100%;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 13px;
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  outline: none;
  margin-bottom: 14px;
  transition: border-color 0.15s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--ink);
}
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .row-2 { grid-template-columns: 1fr; } }

/* ─── STATUS BADGE ───────────────────────────────────────── */
.status {
  display: inline-block;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 3px 10px;
  border-radius: 999px;
}
.status-pending  { background: var(--yolk-s); color: #7A5500; }
.status-paid     { background: var(--olive-s); color: var(--olive); }
.status-disputed { background: #FDF0EB; color: var(--terra); }
.status-resolved { background: var(--olive-s); color: var(--olive); }

/* ─── STEPS BAR ──────────────────────────────────────────── */
.steps-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin: 14px 0;
}
.step-cell {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  padding: 7px 4px;
  border-radius: 8px;
  background: var(--bg2);
  border: 1px solid var(--line);
  color: var(--mut);
}
.step-cell.done { background: var(--olive-s); color: var(--olive); border-color: #BACFC1; }
.step-cell.cur  { background: var(--yolk-s); color: #7A5500; border-color: var(--yolk); }

/* ─── COURIER TRACK ──────────────────────────────────────── */
.courier-row {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  margin: 18px 0;
}
.c-cell { text-align: center; font-size: 11px; color: var(--mut); font-weight: 600; }
.c-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--bg2);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  margin: 0 auto 5px;
  font-size: 11px;
}
.c-cell.done .c-dot { background: var(--olive); color: #fff; border-color: var(--olive); }
.c-cell.cur  .c-dot { background: var(--yolk); color: var(--ink); border-color: var(--ink); }

/* ─── CHAT ───────────────────────────────────────────────── */
.chat-thread {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 240px;
  overflow-y: auto;
  padding: 12px;
  background: var(--bg2);
  border-radius: 12px;
  margin: 12px 0;
}
.msg {
  max-width: 80%;
  padding: 10px 13px;
  border-radius: 13px;
  font-size: 13.5px;
  line-height: 1.4;
}
.msg.seller   { background: var(--ink); color: #fff; align-self: flex-end; }
.msg.customer { background: var(--card); border: 1px solid var(--line); color: var(--ink); align-self: flex-start; }
.msg.system   {
  background: var(--yolk-s);
  border: 1px solid #EDD87A;
  color: #6D4B00;
  font-size: 12px;
  align-self: center;
  text-align: center;
  max-width: 100%;
}
.msg small { display: block; margin-top: 4px; font-size: 10px; opacity: 0.6; }

/* ─── UPI PAYMENT PANEL ──────────────────────────────────── */
.pay-panel {
  margin: 24px 0;
  padding: 24px;
  background: #FFFEF9;
  border: 1.5px solid var(--yolk);
  border-radius: 18px;
}
.pay-method-tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin: 14px 0;
}
.pay-method-tab {
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 16px;
  border-radius: 999px;
  border: 1.5px solid var(--line);
  background: var(--card);
  color: var(--ink2);
  cursor: pointer;
  transition: all 0.15s;
}
.pay-method-tab:hover { border-color: var(--ink); }
.pay-method-tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }

.upi-apps-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 14px 0;
}
.upi-app-btn {
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 16px;
  border-radius: 10px;
  border: 1.5px solid var(--line);
  background: var(--card);
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s;
}
.upi-app-btn:hover { border-color: var(--yolk); background: var(--yolk-s); }
.upi-app-btn.on { background: var(--yolk); border-color: var(--yolk-d); color: var(--ink); }

.pay-hint {
  font-size: 13px;
  color: var(--mut);
  line-height: 1.5;
  margin: 12px 0;
  padding: 10px 14px;
  background: var(--bg2);
  border-radius: 10px;
}

.pay-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 16px;
}

.vpa-copy {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  background: var(--card);
  border: 1.5px dashed #C8BFB0;
  border-radius: 10px;
  font-size: 13px;
  color: var(--ink2);
  margin: 10px 0;
}
.vpa-copy code {
  font-family: 'Courier New', monospace;
  font-size: 14px;
  font-weight: bold;
  color: var(--olive);
}

/* ─── TOAST ──────────────────────────────────────────────── */
.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%);
  background: var(--ink);
  color: #fff;
  padding: 11px 22px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  z-index: 999;
  box-shadow: 0 8px 28px rgba(25,20,16,0.18);
  animation: toast-pop 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  white-space: nowrap;
}
@keyframes toast-pop {
  from { opacity: 0; transform: translate(-50%, 12px) scale(0.95); }
  to   { opacity: 1; transform: translate(-50%, 0) scale(1); }
}

/* ─── FOOTER ─────────────────────────────────────────────── */
footer {
  padding: 32px 24px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 13px;
  color: var(--mut);
  max-width: 1000px;
  margin: 40px auto 0;
}
footer strong { color: var(--ink2); }

  const link = document.createElement('a');

        <span>Paying to:</span>
        <code>${esc(l.businessVpa)}</code>
        <button class="btn btn-outline btn-sm" data-act="copyvpa" style="padding:4px 10px; font-size:11.5px; border-radius:6px;">Copy</button>
      </div>
      <div class="pay-actions">
        <button class="btn btn-yolk" data-act="pay-upi" style="flex:1; justify-content:center; padding:14px 24px; font-size:15px;">
          ${method.cta(l, S.app)}
        </button>
      </div>
      <p style="font-size:11.5px; color:var(--mut); margin-top:10px; line-height:1.5;">
        On mobile, this opens your UPI app directly. On desktop, open this page on your phone to pay.
      </p>
      ` : S.method === 'cod' ? `
      <div class="pay-actions" style="margin-top:0;">
        <button class="btn btn-ink" data-act="pay" style="justify-content:center;">${method.cta(l, S.app)}</button>
      </div>
      ` : `
      <div class="upi-apps-row">
        ${method.apps.map(a =>
          `<button class="upi-app-btn ${S.app===a?'on':''}" data-act="app" data-v="${a}">${a}</button>`
        ).join('')}
      </div>
      <div class="pay-actions">
        <button class="btn btn-ink" data-act="pay" style="justify-content:center;">${method.cta(l, S.app)}</button>
      </div>
      `}
    </div>
    ` : ''}

    <!-- ── SELLER QUICK ACTIONS ────────────────────────── -->
    ${role === 'seller' ? `
    <div style="display:flex; gap:10px; flex-wrap:wrap; margin:16px 0; padding:16px; background:var(--bg2); border-radius:12px; border:1px solid var(--line);">
      <button class="btn btn-outline btn-sm" data-act="copy">📋 Copy Link</button>
      <a class="btn btn-outline btn-sm" style="text-decoration:none;" target="_blank"
        href="https://wa.me/?text=${encodeURIComponent('Hi '+l.customerName+', here\'s your Reachr payment link for '+l.note+'. Click to pay directly — no QR, no redirects.')}">
        💬 Share on WhatsApp
      </a>
      ${l.status === 'pending' ? `<button class="btn btn-outline btn-sm" data-act="cashin">💵 Record Cash Payment</button>` : ''}
    </div>
    ` : ''}

    <!-- ── DISPUTE PANEL ───────────────────────────────── -->
    ${d ? `
    <div style="margin:16px 0; padding:20px; background:#FEFBFA; border:1.5px solid #EAD0C8; border-radius:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3 style="margin:0; font-family:'Bricolage Grotesque',sans-serif; font-size:15px; color:var(--terra);">Dispute: ${esc(d.reason)}</h3>
        <span style="font-size:12px; font-weight:700; color:var(--mut);">Stage ${d.currentStage} of 4</span>
      </div>
      <div class="steps-row">
        ${['1 Raised','2 Proposal','3 Mediation','4 Resolved'].map((n,i) => `
          <div class="step-cell ${i+1<d.currentStage||d.currentStage===4?'done':i+1===d.currentStage?'cur':''}">${n}</div>
        `).join('')}
      </div>
      <div style="margin:14px 0; padding-left:14px; border-left:2px solid var(--line);">
        ${d.timeline.map(e => `
          <p style="margin:0 0 10px; font-size:13px;">
            <strong>${esc(e.title)}</strong> &nbsp;<small style="color:var(--mut);">${e.ts}</small><br>
            <span style="color:var(--ink2);">${esc(e.description)}</span>
          </p>
        `).join('')}
      </div>
      ${d.currentStage===1&&role==='seller' ? `
        <label for="sol" style="margin-top:12px;">Propose a fair solution</label>
        <input id="sol" placeholder="e.g. Free replacement dispatched tomorrow, or 40% partial refund">
        <button class="btn btn-ink btn-sm" data-act="propose">Send Proposal to Buyer</button>
      ` : ''}
      ${d.currentStage===2&&role==='customer' ? `
        <div style="margin-top:12px; background:var(--card); padding:14px; border:1px solid var(--line); border-radius:10px;">
          <strong style="font-size:13.5px;">Seller offered:</strong>
          <span style="font-size:13.5px; color:var(--ink2);"> ${esc(d.proposedSolution)}</span>
          <div style="display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;">
            <button class="btn btn-ink btn-sm" data-act="accept">Accept Proposal</button>
            <button class="btn btn-outline btn-sm" data-act="reject">Request Neutral Review</button>
          </div>
        </div>
      ` : ''}
      ${d.currentStage===3 ? `
        <p style="font-size:13px; color:var(--mut); margin-top:12px;">
          Reachr mediator is reviewing parcel receipts and dispatch photos.
          <button class="btn btn-outline btn-sm" data-act="reviewcomplete" style="margin-top:10px;">Simulate Mediation Complete</button>
        </p>
      ` : ''}
    </div>
    ` : isPaid && role==='customer' ? `
    <div style="margin:16px 0; padding:16px; background:var(--bg2); border:1px solid var(--line); border-radius:12px;">
      <strong style="font-size:14px;">Have an issue with this order?</strong>
      <div style="display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; align-items:center;">
        <select id="rsn" style="max-width:260px; margin:0;">
          <option>Item not as described</option>
          <option>Transit damage</option>
          <option>Wrong variant or quantity</option>
        </select>
        <button class="btn btn-outline btn-sm" data-act="dispute">Raise FairResolve Inquiry</button>
      </div>
    </div>
    ` : ''}

    <!-- ── ORDER CHAT ──────────────────────────────────── -->
    <h3 style="font-family:'Bricolage Grotesque',sans-serif; font-size:15px; font-weight:700; margin:20px 0 8px; letter-spacing:-0.015em;">Order Discussion</h3>
    <div class="chat-thread" id="chat">
      ${l.messages.map(m => `
        <div class="msg ${m.sender}">
          ${esc(m.text)}
          <small>${esc(m.senderName)} · ${m.ts}</small>
        </div>
      `).join('')}
    </div>
    <div style="display:flex; gap:8px;">
      <input id="msgbox" placeholder="Write as ${role}..." style="margin:0; flex:1;">
      <button class="btn btn-ink btn-sm" data-act="send">Send</button>
    </div>
  </div>
  `;
}

function trustCenterHTML() {
  const step = S.trackStep;
  const milestones = ['Order placed', 'Confirmed', 'Packed', 'Dispatched', 'Out for delivery', 'Delivered'];
  return `
  <div style="margin-bottom:32px;">
    <span class="pill" style="margin-bottom:16px; display:inline-flex;"><span class="pill-dot"></span>REACHR TRUST HUB</span>
    <h1 style="font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:clamp(32px,5vw,52px); letter-spacing:-0.04em; line-height:1; color:var(--ink); margin:8px 0 10px;">
      Order protection.<br><em style="font-family:'Newsreader',serif; font-weight:300; font-style:italic; color:var(--terra);">Zero ambiguity.</em>
    </h1>
    <p class="lead">Courier milestones, evidence checklists, and bilateral proof uploads — all in one place.</p>
  </div>

  <div class="card" style="margin-bottom:16px;">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:16px;">
      <div>
        <div style="font-size:11px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--mut); margin-bottom:4px;">Milestone 01</div>
        <h3 class="subhead" style="font-size:17px; margin:0;">Doorstep Dispatch &amp; Courier Progress</h3>
      </div>
      <span class="pill">Simulated Transit</span>
    </div>
    <div class="courier-row">
      ${milestones.map((x,i) => `
        <div class="c-cell ${i<step?'done':i===step?'cur':''}">
          <div class="c-dot">${i<step?'✓':i+1}</div>
          ${x}
        </div>
      `).join('')}
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px;">
      <button class="btn btn-outline btn-sm" data-act="trackprev" ${step===0?'disabled':''}>← Prev Stage</button>
      <button class="btn btn-ink btn-sm" data-act="tracknext" ${step===5?'disabled':''}>Advance Stage →</button>
      <span style="font-size:13px; color:var(--mut); margin-left:auto;">Current: <strong>${milestones[step]}</strong></span>
    </div>
  </div>

  <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:16px;">
    <div class="card">
      <div style="font-size:11px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--mut); margin-bottom:6px;">Milestone 02</div>
      <h3 class="subhead" style="font-size:17px; margin:0 0 8px;">ProofVault™ Record</h3>
      <p style="color:var(--mut); font-size:13.5px; line-height:1.5; margin:0 0 14px;">Attach unboxing or dispatch photos to permanently log item condition.</p>
      <input type="file" id="tcProofFile" accept="image/*" style="margin-bottom:12px;">
      <div id="tcProofPreview">
        ${S.proofData ? `<img src="${S.proofData}" style="max-width:100%; max-height:160px; border-radius:10px; border:1px solid var(--line);" alt="Proof">` : `<p style="color:var(--mut); font-size:13px;">No proof image attached yet.</p>`}
      </div>
    </div>

    <div class="card">
      <div style="font-size:11px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--mut); margin-bottom:6px;">Milestone 03</div>
      <h3 class="subhead" style="font-size:17px; margin:0 0 8px;">Evidence Checklist</h3>
      <select id="tcIssue" style="margin-bottom:8px;">
        <option>Item not as described</option>
        <option>Parcel missing in transit</option>
        <option>Transit damage</option>
      </select>
      <textarea id="tcDetails" rows="2" placeholder="Brief note about the issue...">${esc(S.tcDetails)}</textarea>
      <button class="btn btn-outline" data-act="aiassist" style="width:100%; justify-content:center; font-size:13px;">Generate Evidence Checklist</button>
      <div style="margin-top:12px; background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:12px; font-size:12.5px; line-height:1.6; white-space:pre-wrap; color:var(--ink2);">
        ${S.aiResult ? esc(S.aiResult) : 'Select an issue type above to generate requirements.'}
      </div>
    </div>
  </div>
  `;
}

/* ─── DRAW ───────────────────────────────────────────── */
function draw() {
  const v = S.view;

  document.getElementById('nav-wrap').innerHTML = navHTML(v);

  if (v === 'landing') {
    document.getElementById('root').innerHTML = landingHTML() + footerHTML();
  } else {
    document.getElementById('root').innerHTML = `<div class="app-wrap">` +
      (v === 'seller' ? sellerHTML() : v === 'customer' ? customerHTML() : trustCenterHTML()) +
      footerHTML() + `</div>`;
  }

  if (S.toast) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = S.toast;
    document.body.appendChild(t);
  }

  const c = document.getElementById('chat');
  if (c) c.scrollTop = c.scrollHeight;

  // Wire search live
  const q = document.getElementById('q');
  if (q) q.addEventListener('input', e => { S.q = e.target.value; draw(); });

  // Scroll reveals
  requestAnimationFrame(() => {
    const els = document.querySelectorAll('.r, .r-left, .r-scale');
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('on'); io.unobserve(e.target); }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });
    els.forEach(el => {
      // Elements already in view should fire immediately
      const rect = el.getBoundingClientRect();
      if (rect.top < window.innerHeight - 30) {
        el.classList.add('on');
      } else {
        io.observe(el);
      }
    });
  });
}

/* ─── EVENT BUS ──────────────────────────────────────── */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  const l = cur();
  const role = S.view === 'seller' ? 'seller' : 'customer';

  if (a === 'download-file') {
    const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const lnk = Object.assign(document.createElement('a'), { href: url, download: 'Reachr.html' });
    document.body.appendChild(lnk); lnk.click(); lnk.remove();
    URL.revokeObjectURL(url);
    toast('Saved Reachr.html');
    return;
  }

  if (a === 'role')         { S.view = b.dataset.v; S.sel = null; draw(); return; }
  if (a === 'open')         { S.sel = b.dataset.id; draw(); return; }
  if (a === 'back')         { S.sel = null; draw(); return; }
  if (a === 'method')       { S.method = b.dataset.v; S.app = PM[S.method].apps[0]; draw(); return; }
  if (a === 'app')          { S.app = b.dataset.v; draw(); return; }
  if (a === 'toggle-bill')  { S.billingAnnual = b.dataset.v === 'annual'; draw(); return; }
  if (a === 'tracknext')    { S.trackStep = Math.min(5, S.trackStep + 1); draw(); return; }
  if (a === 'trackprev')    { S.trackStep = Math.max(0, S.trackStep - 1); draw(); return; }
  if (a === 'scroll-create') { document.getElementById('create-card')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }

  if (a === 'copy' && l) {
    navigator.clipboard?.writeText(location.href).catch(() => {});
    toast('Payment link copied!');
    return;
  }

  if (a === 'copyvpa' && l) {
    navigator.clipboard?.writeText(l.businessVpa).catch(() => {});
    toast('UPI VPA copied: ' + l.businessVpa);
    return;
  }

  // ── REAL UPI DEEP LINK ──────────────────────────────
  if (a === 'pay-upi' && l) {
    triggerUPI(l.businessVpa, l.businessName, l.amount, l.note, S.app);
    // Optimistically mark paid after a moment (demo)
    setTimeout(() => {
      l.status = 'paid';
      l.messages.push(msg('system', 'Reachr', `Payment of ${inr(l.amount)} initiated via ${S.app}.`));
      toast(`Opening ${S.app}…`);
      draw();
    }, 600);
    return;
  }

  if (a === 'pay' && l) {
    l.status = 'paid';
    l.messages.push(msg('system', 'Reachr', `Payment of ${inr(l.amount)} confirmed via ${S.app}.`));
    toast('Payment confirmed!');
    draw();
    return;
  }

  if (a === 'cashin' && l) {
    l.status = 'paid';
    l.messages.push(msg('system', 'Reachr', 'Seller recorded doorstep cash payment.'));
    toast('Cash payment recorded — ' + inr(l.amount));
    draw();
    return;
  }

  if (a === 'send' && l) {
    const inp = document.getElementById('msgbox');
    if (!inp?.value.trim()) return;
    l.messages.push(msg(role, role === 'seller' ? l.businessName : l.customerName, inp.value.trim()));
    inp.value = '';
    draw();
    return;
  }

  if (a === 'dispute' && l) {
    const rsn = document.getElementById('rsn')?.value || 'Item not as described';
    l.status = 'disputed';
    l.dispute = {
      id: 'd' + Date.now(),
      raisedAt: clk(),
      reason: rsn,
      currentStage: 1,
      timeline: [{ stage: 1, title: 'Inquiry Raised', description: 'Buyer reported: ' + rsn, ts: clk(), actor: 'customer' }]
    };
    l.messages.push(msg('system', 'Reachr', 'FairResolve inquiry started: ' + rsn));
    toast('Inquiry raised — seller notified');
    draw();
    return;
  }

  if (a === 'propose' && l?.dispute) {
    const sol = document.getElementById('sol')?.value.trim();
    if (!sol) return toast('Please enter a proposal first');
    l.dispute.proposedSolution = sol;
    addEv(l.dispute, 2, 'Seller Proposal', 'Seller offered: ' + sol, 'seller');
    l.messages.push(msg('seller', l.businessName, 'Proposed: ' + sol));
    toast('Proposal sent to buyer');
    draw();
    return;
  }

  if (a === 'accept' && l?.dispute) {
    addEv(l.dispute, 4, 'Resolved by Agreement', 'Buyer accepted seller proposal.', 'customer');
    l.status = 'resolved';
    l.messages.push(msg('system', 'Reachr', 'Dispute resolved amicably.'));
    toast('Dispute resolved!');
    draw();
    return;
  }

  if (a === 'reject' && l?.dispute) {
    addEv(l.dispute, 3, 'Neutral Review Requested', 'Buyer requested mediator review.', 'customer');
    l.messages.push(msg('system', 'Reachr', 'Neutral mediation assigned. Proof review in progress.'));
    toast('Neutral review requested');
    draw();
    return;
  }

  if (a === 'reviewcomplete' && l?.dispute) {
    addEv(l.dispute, 4, 'Resolved via Mediation', 'Balanced resolution by Reachr Trust & Safety.', 'reviewer');
    l.status = 'resolved';
    l.messages.push(msg('system', 'Reachr', 'Dispute concluded by Reachr Trust & Safety.'));
    toast('Mediation completed');
    draw();
    return;
  }

  if (a === 'aiassist') {
    const issue = document.getElementById('tcIssue')?.value || 'Issue';
    const det = document.getElementById('tcDetails')?.value.trim() || 'No notes';
    S.aiResult = `EVIDENCE CHECKLIST — ${issue}\n\n1. Timestamped unboxing or package-state photos\n2. Original product listing specifications screenshot\n3. Courier tracking number and geotagged delivery receipt\n4. Order chat communications log\n5. Payment confirmation screenshot\n\nNote: ${det}`;
    toast('Checklist generated');
    draw();
    return;
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'tcProofFile') {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { S.proofData = reader.result; toast('Photo attached to ProofVault'); draw(); };
    reader.readAsDataURL(file);
  }
});

document.addEventListener('submit', e => {
  if (e.target.id === 'nf') {
    e.preventDefault();
    const name = document.getElementById('cn').value.trim();
    const amt  = +document.getElementById('am').value;
    const note = document.getElementById('nt').value.trim();
    const link = {
      id: 'l' + Date.now(),
      linkCode: 'RCH-' + Math.random().toString(36).slice(2,6).toUpperCase(),
      customerName: name, amount: amt, note,
      businessName: BIZ, businessVpa: VPA,
      status: 'pending',
      messages: [msg('seller', BIZ, `Hi ${name}! Payment link ready for: ${note}. Includes 4-stage delivery protection.`)]
    };
    S.links.unshift(link);
    S.sel = link.id;
    toast('Created link ' + link.linkCode);
    draw();
  }
});

draw();
</script>
</body>
</html>
